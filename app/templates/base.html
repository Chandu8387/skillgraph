<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>{% block title %}SkillGraph{% endblock %}</title>

    <link
        rel="stylesheet"
        href="/static/css/style.css"
    >
</head>

<body>

<header class="navbar">

    <div class="container navbar-inner">

        <a href="/" class="brand">
            <span class="brand-mark">S</span>
            <span>SkillGraph</span>
        </a>

        <nav class="nav-links">
            <a href="/">Dashboard</a>
            <a href="/developers">Developers</a>
            <a href="/skills">Skills</a>
            <a href="/learning-path">Learning Path</a>
        </nav>

    </div>

</header>


<main class="container">

    {% block content %}
    {% endblock %}

</main>


<footer class="footer">

    <div class="container">
        <p>
            SkillGraph · Powered by CognoDB
        </p>
    </div>

</footer>


<script src="/static/js/app.js"></script>

{% block scripts %}
{% endblock %}

</body>
</html>
